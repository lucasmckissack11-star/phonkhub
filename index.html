<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Phonk Hub</title>
  
  <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/727/727204.png" type="image/png">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .track-card { transition: all 0.3s; }
    .track-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
  
    .rank-badge { background: linear-gradient(135deg, #ec4899, #f43f5e); }
    .highlight-box {
      background-color: #f97316;
      color: #000;
      padding: 2px 12px;
      border-radius: 8px;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
      display: inline-block;
      margin-left: 4px;
    }

    #playerModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>

<body class="bg-zinc-950 text-white min-h-screen">

  <header class="bg-black border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <h1 class="text-3xl font-bold tracking-wider">
        PHONK<span class="highlight-box">HUB</span>
      </h1>
      <input type="text" id="search" placeholder="Search tracks..."
             class="bg-zinc-900 border border-zinc-700 rounded-full px-5 py-3 w-96 focus:outline-none focus:border-orange-500">
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
      <i class="fa-solid fa-earth-americas text-orange-500"></i> Global Ranked Chart
    </h2>
    <div id="tracks" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
      <p class="text-zinc-500">Loading tracks...</p>
    </div>
  </div>

  <div id="playerModal">
    <div class="bg-zinc-900 rounded-2xl p-4 max-w-3xl w-full mx-4">
      <div class="flex justify-between items-center mb-4">
        <h3 id="nowPlaying" class="text-lg font-semibold"></h3>
        <button onclick="closePlayer()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      <div class="aspect-video bg-black rounded-xl overflow-hidden">
        <iframe id="youtubePlayer" width="100%" height="100%" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script type="module" src="/main.js"></script>
</body>
</html>
