<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Phonk Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    body { font-family: 'Segoe UI', sans-serif; }
    .track-card { transition: all 0.3s; }
    .track-card:hover { transform: translateY(-8px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5); }
  
    .rank-badge {
      background: linear-gradient(135deg, #ec4899, #f43f5e);
    }
    .highlight-box {
      background-color: #f97316;
      color: #000;
      padding: 2px 12px;
      border-radius: 8px;
      font-weight: 900;
      box-shadow: 0 0 15px rgba(249, 115, 22, 0.6);
      display: inline-block;
      margin-left: 4px;
    }

    #playerModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white min-h-screen">

  <header class="bg-black border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex items-center justify-between">
      <h1 class="text-3xl font-bold tracking-wider">
        PHONK<span class="highlight-box">HUB</span>
      </h1>
      <input type="text" id="search" placeholder="Search tracks..."
             class="bg-zinc-900 border border-zinc-700 rounded-full px-5 py-3 w-96 focus:outline-none focus:border-orange-500">
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-6 py-8">
    <h2 class="text-2xl font-bold mb-6 flex items-center gap-3">
      <i class="fa-solid fa-fire text-orange-500"></i> Ranked Phonk Chart
    </h2>
    <div id="tracks" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
  </div>

  <!-- Player Modal -->
  <div id="playerModal">
    <div class="bg-zinc-900 rounded-2xl p-4 max-w-3xl w-full mx-4">
      <div class="flex justify-between items-center mb-4">
        <h3 id="nowPlaying" class="text-lg font-semibold"></h3>
        <button onclick="closePlayer()" class="text-3xl text-gray-400 hover:text-white">×</button>
      </div>
      <div class="aspect-video bg-black rounded-xl overflow-hidden">
        <iframe id="youtubePlayer" width="100%" height="100%" 
                frameborder="0" 
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                referrerpolicy="strict-origin-when-cross-origin"
                allowfullscreen></iframe>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {

      const tracks = [
        {
          title: "YARA YARA FUNK",
          artist: "JOKO PHONK",
          youtube: "https://youtu.be/EkXu0bPHP-0",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/hq720.jpg"
        },
        {
          title: "TIKI TIKI",
          artist: "QMIIR",
          youtube: "https://youtu.be/ScMkywEH5JM",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/ab67616d0000b27301913aba303b2a409c0cd157.jpg"
        },
        {
          title: "MONTAGEM ALQUIMIA",
          artist: "h6itam",
          youtube: "https://youtu.be/zHm8GFK0m-E",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/artworks-pcTwuvarADB94YKo-1at33A-t500x500.jpg"
        },
        {
          title: "NO BATIDÃO",
          artist: "ZXKAI",
          youtube: "https://youtu.be/ZB0amc1TZ3Y?si=y4S9B0aivPB5io6R",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/Zxkai%2C_Slxughter_-_No_Batid%C3%A3o.png"
        },
        {
          title: "MATADORA",
          artist: "DJ Asul",
          youtube: "https://youtu.be/YIYBhDeQfT0?si=Ed86njD7tKJeKtmV",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/artworks-g2NqowERzqO1-0-t500x500.jpg"
        },
        {
          title: "PASSO BEM SOLTO",
          artist: "ATLXS",
          youtube: "https://youtu.be/KgayxOF4Y7E?si=1aCNVdbd_rw-9A5K",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/Passo_Bem_Solto_-_Atlxs.jpg"
        },
        {
          title: "SHAPE OF YOU FUNK",
          artist: "fennecxx",
          youtube: "https://youtu.be/HhK0koY-9Ko?si=3omq5o3vSlrpRxwG",
          image: "https://raw.githubusercontent.com/lucasmckissack11-star/imagesfr/refs/heads/main/shape.jpg"
        },
      ];

      const tracksContainer = document.getElementById('tracks');
      const searchInput = document.getElementById('search');
      const modal = document.getElementById('playerModal');
      const iframe = document.getElementById('youtubePlayer');
      const nowPlaying = document.getElementById('nowPlaying');

      function renderTracks(filteredTracks) {
        tracksContainer.innerHTML = '';
        
        filteredTracks.forEach((track, index) => {
          const rank = index + 1;
          const card = document.createElement('div');
          card.className = 'track-card bg-zinc-900 rounded-2xl overflow-hidden cursor-pointer relative';
          card.innerHTML = `
            <div class="rank-badge absolute top-3 left-3 text-white text-xs font-bold w-7 h-7 flex items-center justify-center rounded-full shadow-lg z-10">
              #${rank}
            </div>
            <div class="relative">
              <img src="${track.image}" class="w-full h-52 object-cover"
                   onerror="this.src='https://via.placeholder.com/300x200/1f2937/ffffff?text=No+Image'">
              <div class="absolute inset-0 bg-gradient-to-t from-black/80 to-transparent"></div>
             
              <button onclick="playTrack('${track.youtube}', '${track.title}', '${track.artist}')"
                      class="absolute bottom-4 right-4 bg-orange-600 hover:bg-orange-500 w-12 h-12 rounded-full flex items-center justify-center transition shadow-lg">
                <i class="fa-solid fa-play text-xl ml-0.5"></i>
              </button>
            </div>
            <div class="p-4">
              <h3 class="font-semibold text-lg leading-tight">${track.title}</h3>
              <p class="text-zinc-400 text-sm mt-1">${track.artist}</p>
            </div>
          `;
          tracksContainer.appendChild(card);
        });
      }

      window.playTrack = function(url, title, artist) {
        const videoId = url.split('/').pop().split('?')[0];
        iframe.src = `https://www.youtube.com/embed/${videoId}?autoplay=1`;
        nowPlaying.textContent = `${title} - ${artist}`;
        modal.style.display = 'flex';
      };

      window.closePlayer = function() {
        modal.style.display = 'none';
        iframe.src = '';
      };

      searchInput.addEventListener('input', () => {
        const term = searchInput.value.toLowerCase().trim();
        const filtered = term === '' ? tracks : tracks.filter(track =>
          track.title.toLowerCase().includes(term) || track.artist.toLowerCase().includes(term)
        );
        renderTracks(filtered);
      });

      renderTracks(tracks);
    });
  </script>
</body>
</html>
